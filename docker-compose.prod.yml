services:
  postgres:
    image: postgres:18-alpine
    container_name: roadwatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/chitaprr/jpai_roadwatch-backend:latest
    pull_policy: always
    container_name: roadwatch_backend
    restart: unless-stopped
    environment:
      UPLOAD_DIR: ${UPLOAD_DIR}
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      PRODUCTION: ${PRODUCTION}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - backend_uploads:/app/upload
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/chitaprr/jpai_roadwatch-frontend:latest
    pull_policy: always
    container_name: roadwatch_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  postgres_data:
  backend_uploads:
