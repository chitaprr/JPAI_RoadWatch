name: "[0] Deploy"

# Uruchamiany ręcznie z zakładki Actions.
on:
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: "URL backendu wypiekany w bundle frontendu (VITE_API_URL)"
        required: true
        default: "http://149.156.194.192:8103/"
      release_tag:
        description: "Wersja/tag dla obrazu i GitHub Release (np. v1.2.0). Pusty = bez release."
        required: false
        default: ""
      release_type:
        description: "Typ release (używany tylko gdy podano release_tag)"
        type: choice
        options:
          - release
          - prerelease
        default: prerelease

env:
  REGISTRY: ghcr.io
  # GHCR wymaga małych liter w nazwie obrazu
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/jpai_roadwatch

jobs:
  build:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}

      - name: Build & push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # build-arg ignorowany przez backend (nie ma takiego ARG) — Docker po prostu go pomija
          build-args: |
            VITE_API_URL=${{ inputs.vite_api_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create tag & release
    needs: build
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gh tworzy tag git automatycznie na bieżącym commicie, jeśli jeszcze nie istnieje
        run: |
          gh release create "${{ inputs.release_tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ inputs.release_tag }}" \
            --generate-notes \
            ${{ inputs.release_type == 'prerelease' && '--prerelease' || '--latest' }}

  deploy:
    name: Deploy on VM
    needs: build
    # Self-hosted runner działa na VM za VPN — GitHub zleca mu joba, nie ma potrzeby połączenia przychodzącego
    runs-on: self-hosted
    # Nie pozwól na nakładające się deploye
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    steps:
      - name: Pull & restart containers
        working-directory: /home/projekt
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
