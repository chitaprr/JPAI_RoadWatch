services:
  postgres:
    image: postgres:18-alpine
    container_name: roadwatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roadwatch
      POSTGRES_USER: roadwatch
      POSTGRES_PASSWORD: roadwatch
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadwatch -d roadwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: roadwatch_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      UPLOAD_DIR: /app/upload
      DATABASE_URL: "postgresql://roadwatch:roadwatch@postgres:5432/roadwatch?schema=public"
    ports:
      - "8000:8000"
    volumes:
      - ./uploaded_files:/app/upload
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Nadpisywalne z env hosta: VITE_API_URL=https://api... docker compose build
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/}
    container_name: roadwatch_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
